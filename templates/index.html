<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 20px 40px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 20px; }
        .header h1 { font-size: 24px; color: #38bdf8; }
        .nav { display: flex; gap: 10px; margin-left: auto; }
        .nav button { padding: 8px 18px; border-radius: 8px; border: none; background: #334155; color: #e2e8f0; cursor: pointer; font-size: 14px; }
        .nav button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active { display: block; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-bar input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 16px; }
        .search-bar button { padding: 12px 24px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 16px; }
        .search-bar button:hover { background: #7dd3fc; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
        .card h2 { font-size: 16px; color: #94a3b8; margin-bottom: 16px; }
        .price-big { font-size: 48px; font-weight: bold; color: #38bdf8; }
        .price-sub { font-size: 14px; color: #64748b; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { color: #64748b; padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
        td { padding: 10px 8px; border-bottom: 1px solid #1e293b; }
        .positive { color: #34d399; }
        .negative { color: #f87171; }
        .loading { color: #64748b; font-size: 14px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .info-item { background: #0f172a; border-radius: 8px; padding: 12px; }
        .info-label { font-size: 12px; color: #64748b; }
        .info-value { font-size: 18px; font-weight: bold; margin-top: 4px; }
        .industry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .industry-card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
        .industry-card h3 { font-size: 14px; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .industry-card table { font-size: 13px; }
        .industry-card td { padding: 6px 4px; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .filter-bar input { padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; width: 200px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 台股儀表板</h1>
        <div class="nav">
            <button class="active" onclick="showPage('home')">總覽</button>
            <button onclick="showPage('industry')">產業分類</button>
            <button onclick="showPage('stock')">個股查詢</button>
        </div>
    </div>

    <div class="container">

        <!-- 總覽頁面 -->
        <div class="page active" id="page-home">
            <div class="grid" style="margin-bottom:20px;">
                <div class="card">
                    <h2>🔥 三大法人買超前十名</h2>
                    <div id="buyTable"><span class="loading">載入中...</span></div>
                </div>
                <div class="card">
                    <h2>❄️ 三大法人賣超前十名</h2>
                    <div id="sellTable"><span class="loading">載入中...</span></div>
                </div>
            </div>
            <div class="card">
                <h2>📊 買賣超比較圖</h2>
                <canvas id="institutionalChart" height="100"></canvas>
            </div>
        </div>

        <!-- 產業分類頁面 -->
        <div class="page" id="page-industry">
            <div class="filter-bar">
                <input type="text" id="industrySearch" placeholder="🔍 搜尋產業名稱..." oninput="filterIndustry()">
            </div>
            <div class="industry-grid" id="industryGrid">
                <span class="loading">載入中...</span>
            </div>
        </div>

        <!-- 個股查詢頁面 -->
        <div class="page" id="page-stock">
            <div class="search-bar">
                <input type="text" id="stockInput" placeholder="輸入股票代號，例如 2330（台積電）" />
                <button onclick="searchStock()">查詢</button>
            </div>
            <div id="stockCard" style="display:none;">
                <div class="grid">
                    <div class="card">
                        <h2 id="stockName">股票名稱</h2>
                        <div class="price-big" id="stockPrice">--</div>
                        <div class="price-sub" id="stockHighLow"></div>
                    </div>
                    <div class="card">
                        <h2>財務指標</h2>
                        <div class="info-grid" id="stockMetrics"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

<script>
// 頁面切換
function showPage(name) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("page-" + name).classList.add("active");
    event.target.classList.add("active");
}

// 個股查詢
async function searchStock() {
    const id = document.getElementById("stockInput").value.trim();
    if (!id) return;
    document.getElementById("stockCard").style.display = "block";
    document.getElementById("stockPrice").textContent = "載入中...";

    const res = await fetch(`/api/stock/${id}`);
    const data = await res.json();

    if (data.error) {
        document.getElementById("stockPrice").textContent = "查無資料";
        return;
    }

    document.getElementById("stockName").textContent = data.name || id;
    document.getElementById("stockPrice").textContent = `${data.price?.toFixed(1) || "--"} 元`;
    document.getElementById("stockHighLow").textContent = `產業：${data.industry || "N/A"}`;
    document.getElementById("stockMetrics").innerHTML = `
        <div class="info-item"><div class="info-label">本益比 P/E</div><div class="info-value">${typeof data.pe_ratio === "number" ? data.pe_ratio.toFixed(1) : "N/A"}</div></div>
        <div class="info-item"><div class="info-label">股價淨值比 P/B</div><div class="info-value">${typeof data.pb_ratio === "number" ? data.pb_ratio.toFixed(1) : "N/A"}</div></div>
        <div class="info-item"><div class="info-label">ROE</div><div class="info-value">${typeof data.roe === "number" ? (data.roe * 100).toFixed(1) + "%" : "N/A"}</div></div>
        <div class="info-item"><div class="info-label">ROA</div><div class="info-value">${typeof data.roa === "number" ? (data.roa * 100).toFixed(1) + "%" : "N/A"}</div></div>
    `;
}

// 法人資料
let chartInstance = null;
async function loadInstitutional() {
    const res = await fetch("/api/institutional");
    const data = await res.json();

    if (data.error) {
        document.getElementById("buyTable").innerHTML = `<span class="loading">${data.error}</span>`;
        document.getElementById("sellTable").innerHTML = `<span class="loading">${data.error}</span>`;
        return;
    }

    document.getElementById("buyTable").innerHTML = `
        <table>
            <tr><th>股票名稱</th><th>買超（張）</th></tr>
            ${data.buy.map(r => `<tr><td>${r["股票名稱"]}</td><td class="positive">+${(r["三大法人合計"]/1000).toFixed(0)}</td></tr>`).join("")}
        </table>`;

    document.getElementById("sellTable").innerHTML = `
        <table>
            <tr><th>股票名稱</th><th>賣超（張）</th></tr>
            ${data.sell.map(r => `<tr><td>${r["股票名稱"]}</td><td class="negative">${(r["三大法人合計"]/1000).toFixed(0)}</td></tr>`).join("")}
        </table>`;

    const labels = [...data.buy.map(r => r["股票名稱"]), ...data.sell.map(r => r["股票名稱"])];
    const values = [...data.buy.map(r => r["三大法人合計"]/1000), ...data.sell.map(r => r["三大法人合計"]/1000)];
    const colors = values.map(v => v >= 0 ? "#34d399" : "#f87171");

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById("institutionalChart"), {
        type: "bar",
        data: { labels, datasets: [{ label: "三大法人買賣超（張）", data: values, backgroundColor: colors }] },
        options: {
            plugins: { legend: { labels: { color: "#e2e8f0" } } },
            scales: {
                x: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" } },
                y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } }
            }
        }
    });
}

// 產業分類
let industryData = {};
async function loadIndustry() {
    const res = await fetch("/api/industry");
    industryData = await res.json();
    if (industryData.error) {
        document.getElementById("industryGrid").innerHTML = `<span class="loading">${industryData.error}</span>`;
        return;
    }
    renderIndustry(industryData);
}

function renderIndustry(data) {
    const html = Object.entries(data).map(([industry, stocks]) => `
        <div class="industry-card">
            <h3>【${industry}】</h3>
            <table>
                <tr><th>股票</th><th>買賣超（張）</th></tr>
                ${stocks.map(s => `
                    <tr>
                        <td>${s["證券名稱"]}</td>
                        <td class="${s["三大法人買賣超股數"] >= 0 ? "positive" : "negative"}">
                            ${s["三大法人買賣超股數"] >= 0 ? "+" : ""}${(s["三大法人買賣超股數"]/1000).toFixed(0)}
                        </td>
                    </tr>`).join("")}
            </table>
        </div>
    `).join("");
    document.getElementById("industryGrid").innerHTML = html;
}

function filterIndustry() {
    const keyword = document.getElementById("industrySearch").value.trim();
    if (!keyword) { renderIndustry(industryData); return; }
    const filtered = Object.fromEntries(
        Object.entries(industryData).filter(([k]) => k.includes(keyword))
    );
    renderIndustry(filtered);
}

// 頁面載入
loadInstitutional();
loadIndustry();
</script>
</body>
</html>
