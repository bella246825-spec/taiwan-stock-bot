<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>台股儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 16px 20px; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 20px; color: #38bdf8; margin-bottom: 12px; }
        .nav { display: flex; flex-wrap: wrap; gap: 8px; }
        .nav button { flex: 1; min-width: 70px; padding: 8px 10px; border-radius: 8px; border: none; background: #334155; color: #e2e8f0; cursor: pointer; font-size: 13px; }
        .nav button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .container { max-width: 1200px; margin: 16px auto; padding: 0 12px; }
        .page { display: none; }
        .page.active { display: block; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 15px; min-width: 0; }
        .search-bar button { padding: 10px 16px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 15px; white-space: nowrap; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; overflow: hidden; }
        .card h2 { font-size: 15px; color: #94a3b8; margin-bottom: 14px; }
        .price-big { font-size: 40px; font-weight: bold; color: #38bdf8; }
        @media (max-width: 400px) { .price-big { font-size: 32px; } }
        .price-sub { font-size: 13px; color: #64748b; margin-top: 6px; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { color: #64748b; padding: 8px 6px; text-align: left; border-bottom: 1px solid #334155; white-space: nowrap; }
        td { padding: 9px 6px; border-bottom: 1px solid #1e293b; }
        .positive { color: #34d399; }
        .negative { color: #f87171; }
        .loading { color: #64748b; font-size: 14px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-item { background: #0f172a; border-radius: 8px; padding: 10px; }
        .info-label { font-size: 11px; color: #64748b; }
        .info-value { font-size: 16px; font-weight: bold; margin-top: 4px; }
        .industry-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 600px) { .industry-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { .industry-grid { grid-template-columns: repeat(3, 1fr); } }
        .industry-card { background: #1e293b; border-radius: 12px; padding: 14px; border: 1px solid #334155; }
        .industry-card h3 { font-size: 13px; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .industry-card table { font-size: 12px; }
        .industry-card td { padding: 5px 4px; }
        .filter-bar { margin-bottom: 16px; }
        .filter-bar input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; }
        .week-label { font-size: 12px; color: #64748b; margin-bottom: 12px; }
        .description-box { background: #0f172a; border-radius: 8px; padding: 14px; margin-top: 14px; font-size: 13px; line-height: 1.8; color: #94a3b8; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; background: #1e3a5f; color: #38bdf8; margin-right: 6px; margin-bottom: 8px; }
        .chart-wrap { position: relative; width: 100%; overflow-x: auto; }
        canvas { max-width: 100%; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 台股儀表板</h1>
        <div class="nav">
            <button class="active" onclick="showPage('home', this)">總覽</button>
            <button onclick="showPage('weekly', this)">週彙總</button>
            <button onclick="showPage('industry', this)">產業分類</button>
            <button onclick="showPage('stock', this)">個股查詢</button>
        </div>
    </div>

    <div class="container">

        <!-- 總覽 -->
        <div class="page active" id="page-home">
            <div class="grid" style="margin-bottom:16px;">
                <div class="card">
                    <h2>🔥 三大法人買超前十名</h2>
                    <div class="table-wrap">
                        <div id="buyTable"><span class="loading">載入中...</span></div>
                    </div>
                </div>
                <div class="card">
                    <h2>❄️ 三大法人賣超前十名</h2>
                    <div class="table-wrap">
                        <div id="sellTable"><span class="loading">載入中...</span></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>📊 買賣超比較圖</h2>
                <div class="chart-wrap">
                    <canvas id="institutionalChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 週彙總 -->
        <div class="page" id="page-weekly">
            <div class="grid" style="margin-bottom:16px;">
                <div class="card">
                    <h2>🔥 本週三大法人買超前十名</h2>
                    <div class="week-label" id="weekDates">載入中...</div>
                    <div class="table-wrap">
                        <div id="weekBuyTable"><span class="loading">載入中...</span></div>
                    </div>
                </div>
                <div class="card">
                    <h2>❄️ 本週三大法人賣超前十名</h2>
                    <div class="week-label"> </div>
                    <div class="table-wrap">
                        <div id="weekSellTable"><span class="loading">載入中...</span></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>📊 本週買賣超比較圖</h2>
                <div class="chart-wrap">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 產業分類 -->
        <div class="page" id="page-industry">
            <div class="filter-bar">
                <input type="text" id="industrySearch" placeholder="🔍 搜尋產業名稱..." oninput="filterIndustry()">
            </div>
            <div class="industry-grid" id="industryGrid">
                <span class="loading">載入中...</span>
            </div>
        </div>

        <!-- 個股查詢 -->
        <div class="page" id="page-stock">
            <div class="search-bar">
                <input type="text" id="stockInput" placeholder="輸入股票代號，例如 2330" />
                <button onclick="searchStock()">查詢</button>
            </div>
            <div id="stockCard" style="display:none;">
                <!-- 第一排：股價 + 財務指標 -->
                <div class="grid" style="margin-bottom:16px;">
                    <div class="card">
                        <h2 id="stockName">股票名稱</h2>
                        <div id="stockTags" style="margin-bottom:10px;"></div>
                        <div class="price-big" id="stockPrice">--</div>
                        <div class="price-sub" id="stockHighLow"></div>
                    </div>
                    <div class="card">
                        <h2>財務指標</h2>
                        <div class="info-grid" id="stockMetrics"></div>
                    </div>
                </div>
                <!-- 第二排：折線圖 -->
                <div class="card" style="margin-bottom:16px;">
                    <h2>📈 近期股價走勢</h2>
                    <div class="chart-wrap">
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>
                <!-- 第三排：公司簡介 -->
                <div class="card">
                    <h2>🏢 公司簡介</h2>
                    <div class="description-box" id="stockDescription">載入中...</div>
                </div>
            </div>
        </div>

    </div>

<script>
function showPage(name, btn) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("page-" + name).classList.add("active");
    btn.classList.add("active");
}

let stockChartInstance = null;

async function searchStock() {
    const id = document.getElementById("stockInput").value.trim();
    if (!id) return;
    document.getElementById("stockCard").style.display = "block";
    document.getElementById("stockPrice").textContent = "載入中...";
    document.getElementById("stockDescription").textContent = "載入中...";

    const res = await fetch(`/api/stock/${id}`);
    const data = await res.json();

    if (data.error) {
        document.getElementById("stockPrice").textContent = "查無資料";
        document.getElementById("stockDescription").textContent = data.error;
        return;
    }

    document.getElementById("stockName").textContent = data.name || id;
    document.getElementById("stockPrice").textContent = `${data.price?.toFixed(1) || "--"} 元`;
    document.getElementById("stockHighLow").textContent = `今日最高：${data.high || "--"}　最低：${data.low || "--"}`;

    document.getElementById("stockTags").innerHTML = `
        ${data.industry ? `<span class="tag">🏭 ${data.industry}</span>` : ""}
    `;

    document.getElementById("stockMetrics").innerHTML = `
        <div class="info-item"><div class="info-label">本益比 P/E</div><div class="info-value">${data.pe_ratio || "N/A"}</div></div>
        <div class="info-item"><div class="info-label">股價淨值比 P/B</div><div class="info-value">${data.pb_ratio || "N/A"}</div></div>
        <div class="info-item"><div class="info-label">殖利率</div><div class="info-value">${data.dividend_yield ? data.dividend_yield + "%" : "N/A"}</div></div>
        <div class="info-item"><div class="info-label">最新財報</div><div class="info-value" style="font-size:13px;">${data.fiscal_quarter || "N/A"}</div></div>
    `;

    document.getElementById("stockDescription").textContent = data.description || "暫無簡介資料";

    // 折線圖
    if (data.history_dates && data.history_closes) {
        if (stockChartInstance) stockChartInstance.destroy();
        stockChartInstance = new Chart(document.getElementById("stockChart"), {
            type: "line",
            data: {
                labels: data.history_dates,
                datasets: [{
                    label: `${data.name} 收盤價`,
                    data: data.history_closes,
                    borderColor: "#38bdf8",
                    backgroundColor: "rgba(56,189,248,0.1)",
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: "#38bdf8",
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: "#e2e8f0", font: { size: 12 } } }
                },
                scales: {
                    x: { ticks: { color: "#94a3b8", font: { size: 10 }, maxRotation: 45 }, grid: { color: "#1e293b" } },
                    y: { ticks: { color: "#94a3b8", font: { size: 11 } }, grid: { color: "#334155" } }
                }
            }
        });
    }
}

let chartInstance = null;
async function loadInstitutional() {
    const res = await fetch("/api/institutional");
    const data = await res.json();
    if (data.error) {
        document.getElementById("buyTable").innerHTML = `<span class="loading">${data.error}</span>`;
        document.getElementById("sellTable").innerHTML = `<span class="loading">${data.error}</span>`;
        return;
    }
    document.getElementById("buyTable").innerHTML = `
        <table><tr><th>股票名稱</th><th>買超（張）</th></tr>
        ${data.buy.map(r => `<tr><td>${r["證券名稱"]}</td><td class="positive">+${(r["三大法人合計"]/1000).toFixed(0)}</td></tr>`).join("")}
        </table>`;
    document.getElementById("sellTable").innerHTML = `
        <table><tr><th>股票名稱</th><th>賣超（張）</th></tr>
        ${data.sell.map(r => `<tr><td>${r["證券名稱"]}</td><td class="negative">${(r["三大法人合計"]/1000).toFixed(0)}</td></tr>`).join("")}
        </table>`;
    const labels = [...data.buy.map(r => r["證券名稱"]), ...data.sell.map(r => r["證券名稱"])];
    const values = [...data.buy.map(r => r["三大法人合計"]/1000), ...data.sell.map(r => r["三大法人合計"]/1000)];
    const colors = values.map(v => v >= 0 ? "#34d399" : "#f87171");
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById("institutionalChart"), {
        type: "bar",
        data: { labels, datasets: [{ label: "三大法人買賣超（張）", data: values, backgroundColor: colors }] },
        options: {
            responsive: true,
            plugins: { legend: { labels: { color: "#e2e8f0", font: { size: 12 } } } },
            scales: {
                x: { ticks: { color: "#94a3b8", font: { size: 11 }, maxRotation: 45 }, grid: { color: "#1e293b" } },
                y: { ticks: { color: "#94a3b8", font: { size: 11 } }, grid: { color: "#334155" } }
            }
        }
    });
}

let weeklyChartInstance = null;
async function loadWeekly() {
    const res = await fetch("/api/weekly");
    const data = await res.json();
    if (data.error) {
        document.getElementById("weekBuyTable").innerHTML = `<span class="loading">${data.error}</span>`;
        document.getElementById("weekSellTable").innerHTML = `<span class="loading">${data.error}</span>`;
        return;
    }
    const dateStr = data.dates.map(d => `${d.slice(4,6)}/${d.slice(6,8)}`).join("、");
    document.getElementById("weekDates").textContent = `統計區間：${dateStr}`;
    document.getElementById("weekBuyTable").innerHTML = `
        <table><tr><th>股票名稱</th><th>週合計（張）</th></tr>
        ${data.buy.map(r => `<tr><td>${r["股票名稱"]}</td><td class="positive">+${(r["週合計買賣超"]/1000).toFixed(0)}</td></tr>`).join("")}
        </table>`;
    document.getElementById("weekSellTable").innerHTML = `
        <table><tr><th>股票名稱</th><th>週合計（張）</th></tr>
        ${data.sell.map(r => `<tr><td>${r["股票名稱"]}</td><td class="negative">${(r["週合計買賣超"]/1000).toFixed(0)}</td></tr>`).join("")}
        </table>`;
    const labels = [...data.buy.map(r => r["股票名稱"]), ...data.sell.map(r => r["股票名稱"])];
    const values = [...data.buy.map(r => r["週合計買賣超"]/1000), ...data.sell.map(r => r["週合計買賣超"]/1000)];
    const colors = values.map(v => v >= 0 ? "#34d399" : "#f87171");
    if (weeklyChartInstance) weeklyChartInstance.destroy();
    weeklyChartInstance = new Chart(document.getElementById("weeklyChart"), {
        type: "bar",
        data: { labels, datasets: [{ label: "本週三大法人買賣超（張）", data: values, backgroundColor: colors }] },
        options: {
            responsive: true,
            plugins: { legend: { labels: { color: "#e2e8f0", font: { size: 12 } } } },
            scales: {
                x: { ticks: { color: "#94a3b8", font: { size: 11 }, maxRotation: 45 }, grid: { color: "#1e293b" } },
                y: { ticks: { color: "#94a3b8", font: { size: 11 } }, grid: { color: "#334155" } }
            }
        }
    });
}

let industryData = {};
async function loadIndustry() {
    const res = await fetch("/api/industry");
    industryData = await res.json();
    if (industryData.error) {
        document.getElementById("industryGrid").innerHTML = `<span class="loading">${industryData.error}</span>`;
        return;
    }
    renderIndustry(industryData);
}

function renderIndustry(data) {
    const html = Object.entries(data).map(([industry, stocks]) => `
        <div class="industry-card">
            <h3>【${industry}】</h3>
            <table>
                <tr><th>股票</th><th>買賣超（張）</th></tr>
                ${stocks.map(s => `
                    <tr>
                        <td>${s["證券名稱"]}</td>
                        <td class="${s["三大法人買賣超股數"] >= 0 ? "positive" : "negative"}">
                            ${s["三大法人買賣超股數"] >= 0 ? "+" : ""}${(s["三大法人買賣超股數"]/1000).toFixed(0)}
                        </td>
                    </tr>`).join("")}
            </table>
        </div>
    `).join("");
    document.getElementById("industryGrid").innerHTML = html;
}

function filterIndustry() {
    const keyword = document.getElementById("industrySearch").value.trim();
    if (!keyword) { renderIndustry(industryData); return; }
    const filtered = Object.fromEntries(
        Object.entries(industryData).filter(([k]) => k.includes(keyword))
    );
    renderIndustry(filtered);
}

loadInstitutional();
loadWeekly();
loadIndustry();
</script>
</body>
</html>
